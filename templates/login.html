{% extends 'base.html' %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="auth-card" style="width: 100%;">
        <div style="text-align: center; margin-bottom: 32px;">
            <h2 style="font-size: 28px; margin-bottom: 8px;">Welcome Back</h2>
            <p style="margin: 0;">Log in to access your CreditAI dashboard</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div style="background: var(--danger-light); color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 600;">
                    {{ form.non_field_errors.0 }}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                {{ form.username }}
            </div>
            
            <div class="form-group">
                <label for="id_password">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-block" style="margin-top: 16px; padding: 14px;">Log In</button>
        </form>

        <div style="text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-muted);">
            Don't have an account? <a href="{% url 'register' %}" style="font-weight: 600;">Create one here</a>
        </div>
    </div>
</div>
{% endblock %}
