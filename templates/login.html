{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CreditAI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="dashboard-navbar">
        <div class="dashboard-logo">Credit<span>AI</span></div>
        <div class="dashboard-nav-links">
            <a href="/">Home</a>
            <a href="/register/">Register</a>
        </div>
    </nav>
    <div class="form-container" style="max-width: 500px;">
        <div class="auth-form">
            <h2 style="text-align: center; margin-bottom: 24px;">Welcome Back</h2>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                {% if form.non_field_errors %}
                    <div style="color: var(--danger); margin-bottom: 16px; font-size: 14px;">
                        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
                    </div>
                {% endif %}
                <button type="submit" class="btn" style="width: 100%; margin: 16px 0 0;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 24px; font-size: 14px;">
                Don't have an account? <a href="/register/">Register here</a>
            </form>
        </div>
    </div>
</body>
</html>
