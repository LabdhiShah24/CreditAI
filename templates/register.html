<!DOCTYPE html>
<html>

<head>
    <title>Register - CreditAI</title>
</head>

<body>

    <h1>Create Your CreditAI Account</h1>

    {% if success %}
        <p>Registration successful! Your account has been created.</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>

    </form>

</body>

</html>
